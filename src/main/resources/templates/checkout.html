<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout - Muscle Up</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #fef6e4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1f2937;
            padding: 1rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #fbbf24;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1f2937;
            margin-bottom: 1rem;
        }

        label {
            font-weight: bold;
            color: #1f2937;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .cart-summary {
            margin-top: 2rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .total {
            font-weight: bold;
            color: #b45309;
            margin-top: 1rem;
            font-size: 1.2rem;
            text-align: right;
        }

        button {
            background-color: #fbbf24;
            color: #1f2937;
            font-weight: bold;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1.5rem;
            width: 100%;
        }

        button:hover {
            background-color: #b45309;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">MUSCLE UP</div>
        <div>
            <a href="/home">Home</a>
			<b><a href="/cart" th:href="@{/cart}">Cart</a></b>
			<b><a href="/orders" th:href="@{/orders/history}">MyOrders</a></b>
			<b><a href="/logout" th:href="@{/users/logout}">Logout</a></b>
        </div>
    </nav>

    <div class="container">
        <h2>Checkout</h2>

        <form th:action="@{/checkout}" method="post">
            <label for="deliveryAddress">Delivery Address:</label>
            <input type="text" id="deliveryAddress" name="deliveryAddress" placeholder="Enter full address..." required>

            <div class="cart-summary">
                <h3>Cart Summary</h3>
                <div th:each="item : ${cart.items}" class="cart-item">
                    <span th:text="${item.product.name}"></span>
                    <span th:text="'₹' + ${item.product.price} + ' x ' + ${item.quantity}"></span>
                </div>
                <div class="total">
                    Total: ₹<span th:text="${cart.total}">0.00</span>
                </div>
            </div>

            <button type="submit">Place Order (COD)</button>
        </form>
    </div>

</body>
</html>

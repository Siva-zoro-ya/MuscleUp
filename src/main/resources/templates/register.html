<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Muscle Up</title>
    <style>
        :root {
            --primary: #fbbf24;   
            --secondary: #b45309;  
            --text: #1f2937;      
            --background: #fef6e4;
            --text-light: #ffffff; 
            --link-color: #1f2937; 
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .navbar {
            background-color: var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            color: var(--text-light);
            font-size: 1.5rem;
             font-weight: 800; 
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: var(--link-color);
            margin-left: 1.5rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--secondary); 
        }
        .registration-container {
            margin: auto;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .registration-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text);
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .input-group input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            background-color: var(--primary);
            color: var(--text-light);
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: var(--secondary);
        }
        .success-message {
            color: green;
            margin-top: 1rem;
        }
        .error-message {
            color: red;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">MUSCLE UP</a>
        <div class="nav-links">
           <b><a href="/users/login" th:href="@{/users/login}">Login</a></b>
        </div>
    </nav>

    <!-- Registration Container -->
    <div class="registration-container">
        <h1 class="registration-title">Create Account</h1>
        <form th:action="@{/users/register}" method="post">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="mobile">Mobile</label>
                <input type="text" id="mobile" name="mobile">
            </div>
            <button type="submit" class="btn">Register</button>
            <div class="success-message" th:if="${param.success}">
                Registration successful! You can now log in.
            </div>
            <div class="error-message" th:if="${error}">
                <p th:text="${error}"></p>
            </div>
        </form>
    </div>
</body>
</html>

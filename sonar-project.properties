# Required metadata
sonar.projectKey=MuscleUp
sonar.projectName=MuscleUp
sonar.projectVersion=1.0

# Source directories (adjust if needed)
sonar.sources=src/main/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java language version
sonar.java.source=17

# Where compiled .class files are stored
sonar.java.binaries=target/classes

# Optional: Exclude tests or config files if you want
sonar.exclusions=**/test/**, **/config/**
    